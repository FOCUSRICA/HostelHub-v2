
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelHub - Supabase Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      color: #263238;
      background: #f6f8fa;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
    }
    h1 { color: #d93670; }
    #status { line-height: 1.6; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>HostelHub Connection Test</h1>
    <p id="status">Connecting to Supabase...</p>
  </main>

  <script type="module">
    import { supabase } from "./js/supabase.js";

    const status = document.getElementById("status");

    async function testConnection() {
      try {
        const { data, error } = await supabase
          .from("hostels")
          .select("id, name")
          .limit(1);

        if (error) {
          status.textContent =
            "Connection test failed: " + error.message;
          return;
        }

        status.textContent =
          "Success! Supabase is connected. " +
          "Hostel records returned: " + data.length +
          ". The connection and table read are working.";
      } catch (error) {
        status.textContent =
          "Test failed. Check js/supabase.js and your publishable key.";
        console.error(error);
      }
    }

    testConnection();
  </script>
</body>
</html>

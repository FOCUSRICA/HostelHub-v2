
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in or create your HostelHub student account.">
  <title>Sign in | HostelHub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #f02d83;
      --pink-dark: #cf1768;
      --ink: #f7f4f8;
      --muted: #bcb5c3;
      --glass: rgba(21, 25, 27, .78);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", Arial, sans-serif;
      color: var(--ink);
      background: #111719;
      overflow-x: hidden;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: -1;
      pointer-events: none;
      filter: blur(55px);
      opacity: .62;
    }

    body::before {
      background:
        radial-gradient(ellipse at 25% 35%,
          rgba(223, 42, 112, .48), transparent 38%),
        radial-gradient(ellipse at 78% 58%,
          rgba(34, 104, 74, .36), transparent 38%);
      animation: ambientDrift 13s ease-in-out infinite alternate;
    }

    body::after {
      background:
        radial-gradient(ellipse at 55% 95%,
          rgba(132, 31, 87, .25), transparent 42%);
      animation: ambientDrift 17s ease-in-out infinite alternate-reverse;
    }

    header {
      background: rgba(12, 17, 19, .65);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .nav {
      width: min(1050px, 92%);
      min-height: 72px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      text-decoration: none;
      color: var(--ink);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), #9d205b);
      box-shadow: 0 0 25px rgba(240, 45, 131, .25);
    }

    .back-link {
      color: #f4b8d2;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: color .2s ease, transform .2s ease;
    }

    .back-link:hover {
      color: #fff;
      transform: translateX(-2px);
    }

    main {
      width: min(460px, 92%);
      margin: 42px auto 30px;
      perspective: 1000px;
    }

    .intro {
      text-align: center;
      margin-bottom: 24px;
      animation: riseIn .7s ease both;
    }

    .intro h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 36px);
      letter-spacing: -1.2px;
      text-shadow: 0 4px 28px rgba(240, 45, 131, .12);
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .panel {
      position: relative;
      overflow: hidden;
      background: var(--glass);
      padding: clamp(22px, 5vw, 34px);
      border: 1px solid rgba(255, 255, 255, .16);
      border-top: 2px solid rgba(240, 45, 131, .8);
      border-radius: 22px;
      box-shadow:
        0 28px 80px rgba(0, 0, 0, .35),
        0 0 45px rgba(240, 45, 131, .08);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      animation: cardFloat 6s ease-in-out infinite,
                 riseIn .8s .08s ease both;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: -90px;
      right: -65px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(240, 45, 131, .12);
      filter: blur(28px);
      pointer-events: none;
    }

    .tabs {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      background: rgba(0, 0, 0, .24);
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 13px;
      margin-bottom: 24px;
    }

    .tab {
      padding: 12px 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition:
        color .25s ease,
        background .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
    }

    .tab:hover {
      color: #fff;
      transform: translateY(-1px);
    }

    .tab.active {
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      border-color: rgba(255, 255, 255, .12);
      box-shadow: 0 5px 20px rgba(240, 45, 131, .24);
    }

    .field {
      margin-bottom: 17px;
      animation: fieldIn .28s ease both;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #e8e1eb;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 10px;
      background: rgba(5, 9, 10, .32);
      color: #fff;
      font: inherit;
      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input::placeholder {
      color: #817b87;
    }

    input:focus {
      outline: none;
      border-color: var(--pink);
      background: rgba(5, 9, 10, .48);
      box-shadow:
        0 0 0 3px rgba(240, 45, 131, .14),
        0 0 22px rgba(240, 45, 131, .08);
    }

    .submit {
      width: 100%;
      min-height: 49px;
      margin-top: 5px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px;
      background: linear-gradient(
        110deg, var(--pink-dark), var(--pink), #f34e9a
      );
      background-size: 180% 100%;
      color: #fff;
      font: inherit;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(240, 45, 131, .2);
      transition:
        background-position .35s ease,
        transform .25s ease,
        box-shadow .25s ease;
    }

    .submit:hover {
      background-position: 100% 0;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(240, 45, 131, .3);
    }

    .submit:active {
      transform: translateY(0) scale(.99);
    }

    .submit:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;
      margin: 16px 0 0;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.show {
      display: block;
      animation: riseIn .25s ease both;
    }

    .message.error {
      color: #ffd4d4;
      background: rgba(145, 35, 47, .24);
      border-color: rgba(255, 120, 120, .2);
    }

    .message.success {
      color: #c9f6d8;
      background: rgba(20, 91, 55, .25);
      border-color: rgba(113, 226, 159, .18);
    }

    .help {
      margin: 20px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
    }

    footer {
      padding: 22px;
      text-align: center;
      color: #918b97;
      font-size: 13px;
    }

    [hidden] {
      display: none !important;
    }

    @keyframes ambientDrift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(3%, 2%, 0) scale(1.08); }
    }

    @keyframes cardFloat {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -5px; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fieldIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .nav { min-height: 64px; }
      .brand { font-size: 19px; }
      .back-link { font-size: 12px; }
      main { margin-top: 28px; }
      .panel { border-radius: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="nav">
      <a class="brand" href="./index.html">
        <span class="brand-mark">H</span>
        <span>HostelHub</span>
      </a>
      <a class="back-link" href="./index.html">
        ← Back to accommodation
      </a>
    </div>
  </header>

  <main>
    <div class="intro">
      <h1 id="page-title">Welcome back</h1>
      <p>Sign in to continue with HostelHub.</p>
    </div>

    <section class="panel" aria-label="Account access">
      <div class="tabs" role="tablist" aria-label="Account action">
        <button class="tab active" id="signin-tab" type="button"
          role="tab" aria-selected="true">
          Sign in
        </button>

        <button class="tab" id="register-tab" type="button"
          role="tab" aria-selected="false">
          Create account
        </button>
      </div>

      <form id="auth-form">
        <div class="field" id="name-field" hidden>
          <label for="full-name">Full name</label>
          <input id="full-name" name="fullName"
            autocomplete="name" placeholder="Enter your full name">
        </div>

        <div class="field" id="phone-field" hidden>
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel"
            autocomplete="tel" placeholder="e.g. 09XXXXXXXX">
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email"
            autocomplete="email" placeholder="Enter your email" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
            autocomplete="current-password" placeholder="Enter your password"
            minlength="8" required>
        </div>

        <button class="submit" id="submit-button" type="submit">
          Sign in
        </button>

        <p id="message" class="message" role="status"
          aria-live="polite"></p>
      </form>

      <p class="help">
        Student registration is open here. Hostel owners use their existing
        authorized account to sign in; owner access is controlled by the
        profile role and database permissions.
      </p>
    </section>
  </main>

  <footer>HostelHub · Find Your Space</footer>

  <script type="module">
    import {
      registerStudent,
      signIn,
      getMyProfile
    } from "./js/auth.js";

    const form = document.getElementById("auth-form");
    const signinTab = document.getElementById("signin-tab");
    const registerTab = document.getElementById("register-tab");
    const nameField = document.getElementById("name-field");
    const phoneField = document.getElementById("phone-field");
    const fullName = document.getElementById("full-name");
    const phone = document.getElementById("phone");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const submitButton = document.getElementById("submit-button");
    const message = document.getElementById("message");
    const pageTitle = document.getElementById("page-title");

    let mode = "signin";

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message show " + type;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const registering = mode === "register";

      nameField.hidden = !registering;
      phoneField.hidden = !registering;

      fullName.required = registering;
      phone.required = registering;

      password.autocomplete = registering
        ? "new-password"
        : "current-password";

      signinTab.classList.toggle("active", !registering);
      registerTab.classList.toggle("active", registering);

      signinTab.setAttribute("aria-selected", String(!registering));
      registerTab.setAttribute("aria-selected", String(registering));

      pageTitle.textContent = registering
        ? "Create your account"
        : "Welcome back";

      submitButton.textContent = registering
        ? "Create student account"
        : "Sign in";

      message.className = "message";
      message.textContent = "";
    }

    signinTab.addEventListener("click", () => setMode("signin"));
    registerTab.addEventListener("click", () => setMode("register"));

    // Allow the homepage's Create account link to open registration directly.
    if (window.location.hash === "#register") {
      setMode("register");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      submitButton.disabled = true;
      message.className = "message";

      try {
        if (mode === "register") {
          await registerStudent({
            email: email.value,
            password: password.value,
            fullName: fullName.value,
            phone: phone.value
          });

          showMessage(
            "Registration submitted. If email confirmation is enabled, " +
            "check your inbox before signing in. New registrations are " +
            "student accounts.",
            "success"
          );
        } else {
          await signIn(email.value, password.value);

          const profile = await getMyProfile();

          if (!profile) {
            showMessage(
              "You signed in, but your profile could not be found. " +
              "Please contact the site administrator.",
              "error"
            );
            return;
          }

          if (profile.role === "owner") {
            showMessage(
              "Signed in successfully as an owner. Owner dashboard " +
              "features still need to be connected.",
              "success"
            );
          } else if (profile.role === "student") {
            showMessage(
              "Signed in successfully as a student. Student dashboard " +
              "features still need to be connected.",
              "success"
            );
          } else {
            showMessage(
              "Your account role is not recognized. Please contact " +
              "the site administrator.",
              "error"
            );
          }
        }
      } catch (error) {
        showMessage(
          error?.message || "Something went wrong. Please try again.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
